{{ define "main" }}
<h1>{{ .Title }}</h1>
<div class="news-grid">
  <div class="cards">
    {{ range .Paginator.Pages }}
    <a class="card" href="{{ .RelPermalink }}">
      {{ with .Date }}<time>{{ .Format "02.01.2006" }}</time>{{ end }}
      <h3>{{ .Title }}</h3>
      {{ with .Summary }}<p>{{ truncate 140 . }}</p>{{ end }}
    </a>
    {{ end }}
  </div>
</div>
{{ template "_internal/pagination.html" . }}
{{ end }}
